services:
  - type: web
    name: yatara-mobile-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MOBILE_DB_NAME
        value: yatara-mobile
      - key: REQUIRE_MOBILE_DB
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
