name: Mobile Assignment Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile/Yatara-Ceylon

      - name: Backend syntax check
        run: find backend -path 'backend/node_modules' -prune -o -name '*.js' -print | xargs node --check

      - name: Mobile typecheck
        run: npx tsc --noEmit
        working-directory: mobile/Yatara-Ceylon

      - name: Mobile lint
        run: npm run lint
        working-directory: mobile/Yatara-Ceylon
